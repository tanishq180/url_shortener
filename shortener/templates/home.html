<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ URL Shortener | Shorten Links Instantly</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .content {
            padding: 40px 30px;
        }

        .url-input-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: white;
        }

        .url-input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-icon {
            padding: 12px 15px;
            color: #999;
        }

        input[type="url"] {
            flex: 1;
            padding: 14px 15px 14px 0;
            border: none;
            font-size: 1rem;
            outline: none;
        }

        .btn-shorten {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-shorten:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .result-card {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .shortened-url {
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
        }

        .shortened-url a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.8rem; }
            .content { padding: 30px 20px; }
            .shortened-url { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-link"></i> URL Shortener</h1>
            <p>Shorten long links instantly and track clicks</p>
        </div>

        <div class="content">
            <form method="POST" id="shortenForm">
                {% csrf_token %}
                <div class="url-input-wrapper">
                    <i class="fas fa-globe input-icon"></i>
                    <input type="url" name="original_url" placeholder="https://example.com/very-long-link..." required>
                </div>
                <button type="submit" class="btn-shorten">
                    <i class="fas fa-magic"></i> Shorten URL
                </button>
            </form>

            {% if short_url %}
            <div class="result-card">
                <p style="color: #667eea; font-weight: 600; margin-bottom: 10px;">
                    <i class="fas fa-check-circle"></i> Your shortened link is ready!
                </p>
                <div class="shortened-url">
                    <a href="{{ short_url }}" target="_blank" id="shortLink">{{ short_url }}</a>
                    <button class="copy-btn" onclick="copyToClipboard()">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
                <p style="margin-top: 10px; font-size: 0.85rem;">
                    <i class="fas fa-chart-line"></i> 
                    <a href="/stats/{{ short_url|slice:'-7:'|cut:'/' }}" style="color: #667eea;">View statistics</a>
                </p>
            </div>
            {% endif %}
        </div>

        <div class="footer">
            <p><i class="fas fa-bolt"></i> Free • Fast • Reliable • Track every click</p>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const link = document.getElementById('shortLink').href;
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy', 2000);
            });
        }
    </script>
</body>
</html>
